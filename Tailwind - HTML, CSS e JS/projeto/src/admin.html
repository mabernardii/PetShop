<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script src="https://cdn.tailwindcss.com"></script>
<title>Admin</title>
</head>

<body class="bg-gray-100 flex justify-center items-center min-h-screen">

<div class="bg-white p-8 rounded-2xl shadow w-full max-w-md">

<h2 class="text-xl font-bold mb-4 text-center">Cadastrar Produto</h2>

<form id="formProduto">

<input id="nome" placeholder="Nome" class="border p-2 w-full mb-2">
<input id="descricao" placeholder="Descrição" class="border p-2 w-full mb-2">
<input id="preco" placeholder="Preço" class="border p-2 w-full mb-2">
<input id="precoDesconto" placeholder="Desconto" class="border p-2 w-full mb-2">
<input id="imagem" placeholder="URL imagem" class="border p-2 w-full mb-2">

<img id="preview" class="hidden h-32 w-full object-cover mb-2">

<input id="estoque" placeholder="Estoque" class="border p-2 w-full mb-2">

<select id="categoria" class="border p-2 w-full mb-4"></select>

<button class="bg-teal-500 text-white p-2 w-full">Salvar</button>

</form>

</div>

<script>
async function carregarCategorias() {
  const res = await fetch("http://localhost:8080/api/categorias");
  const data = await res.json();

  data.forEach(c => {
    categoria.innerHTML += `<option value="${c.id_categoria}">${c.nome}</option>`;
  });
}

imagem.addEventListener("input", () => {
  preview.src = imagem.value;
  preview.classList.remove("hidden");
});

formProduto.addEventListener("submit", async e => {
  e.preventDefault();

  const produto = {
    nome: nome.value,
    descricao: descricao.value,
    preco: parseFloat(preco.value),
    preco_desconto: parseFloat(precoDesconto.value),
    imagem: imagem.value,
    qtd_estoque: parseInt(estoque.value),
    idCategoria: parseInt(categoria.value)
  };

  await fetch("http://localhost:8081/api/produtos", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(produto)
  });

  alert("Produto cadastrado!");
  formProduto.reset();
});

carregarCategorias();
</script>

</body>
</html>
